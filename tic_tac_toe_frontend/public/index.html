<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <meta
      name="description"
      content="Tic Tac Toe game with history"
    />
    <title>Tic Tac Toe</title>
    <!-- Runtime config loader: loads /config.json and assigns window.__APP_CONFIG__ -->
    <script>
      (function loadRuntimeConfig() {
        // Only attempt to fetch if not already present
        if (!window.__APP_CONFIG__) {
          try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '%PUBLIC_URL%/config.json', false); // sync to guarantee availability before main bundle
            xhr.send(null);
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                window.__APP_CONFIG__ = JSON.parse(xhr.responseText || '{}');
              } catch (e) {
                window.__APP_CONFIG__ = {};
                console.error('[TicTacToe][Config] Failed parsing config.json:', e);
              }
            } else {
              window.__APP_CONFIG__ = {};
            }
          } catch (e) {
            window.__APP_CONFIG__ = {};
            console.warn('[TicTacToe][Config] Could not load config.json at startup:', e && e.message);
          }
        }
        // Visible log of resolved runtime config
        try {
          console.log('[TicTacToe][Config] Runtime window.__APP_CONFIG__:', window.__APP_CONFIG__ || {});
        } catch (e) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
